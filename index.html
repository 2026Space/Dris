      + ' border-radius:999px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.32);'
      + ' backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transition:opacity .8s ease .8s;'
      + ' opacity:' + (site ? 1 : 0) + '; pointer-events:' + (site ? 'auto' : 'none') + ';');
    soundBtn.firstElementChild.innerHTML = state.muted ? "&#9834;&#824;" : "&#9834;";
  }

  function setSource(el, src){
    if (!el || el.getAttribute("src") === src) return;
    el.setAttribute("src", src);
    if (el.tagName === "VIDEO"){ el.load(); el.muted = true; el.play().catch(function(){}); }
  }
  function applySources(mobile){
    setSource(bg, mobile ? "assets/illus-mobile-720.mp4" : "assets/illus-desktop-720.mp4");
    introVid.poster = mobile ? "assets/intro-mobile.png" : "assets/intro-desktop.png";
    setSource(introVid, mobile ? "assets/intro-mobile.mp4" : "assets/intro-desktop.mp4");
  }

  var mq = window.matchMedia("(max-width: 820px), (orientation: portrait)");
  function applyMq(){ state.mobile = mq.matches; applyStyles(); applySources(mq.matches); }
  applyMq();
  if (mq.addEventListener) mq.addEventListener("change", applyMq); else mq.addListener(applyMq);

  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible"){
      videos.forEach(function(v){ if (v && v.paused){ v.muted = true; v.play().catch(function(){}); } });
    }
  });
  setInterval(function(){
    videos.forEach(function(v){
      if (!v) return;
      if (!v.muted) v.muted = true;
      if (v.volume !== 0) v.volume = 0;
      if (!v.hasAttribute("muted")) v.setAttribute("muted", "");
    });
  }, 1000);
  document.addEventListener("pointerdown", function(){
    videos.forEach(function(v){ if (v && v.paused){ v.muted = true; v.volume = 0; v.play().catch(function(){}); } });
  });
  setTimeout(function(){ videos.forEach(function(v){ if (v){ v.muted = true; v.play().catch(function(){}); } }); }, 60);

  function startMusic(){
    var rest = ["diva.mp3", "you.mp3"].sort(function(){ return Math.random() - 0.5; });
    playlist = ["die.mp3"].concat(rest);
    track = 0;
    var a = new Audio(playlist[0]);
    a.volume = 0.85;
    a.addEventListener("ended", function(){
      track = (track + 1) % playlist.length;
      a.src = playlist[track];
      a.play().catch(function(){});
    });
    audio = a;
    a.play().catch(function(){});
  }

  enterBtn.addEventListener("click", function(){
    if (state.phase !== "intro") return;
    startMusic();
    if (bg){ bg.muted = true; if (bg.readyState === 0) bg.load(); bg.play().catch(function(){}); }
    state.phase = "leaving";
    applyStyles();
    setTimeout(function(){ state.phase = "site"; applyStyles(); }, 1600);
  });
  enterBtn.addEventListener("mouseenter", function(){ this.style.background = "rgba(255,255,255,.2)"; this.style.transform = "translateY(-2px)"; });
  enterBtn.addEventListener("mouseleave", function(){ this.style.background = "rgba(255,255,255,.12)"; this.style.transform = "none"; });

  soundBtn.addEventListener("click", function(){
    state.muted = !state.muted;
    if (audio) audio.muted = state.muted;
    applyStyles();
  });

  applyStyles();

  var block = function(e){ e.preventDefault(); e.stopPropagation(); return false; };
  document.addEventListener("contextmenu", block, { capture: true });
  document.addEventListener("selectstart", block, { capture: true });
  document.addEventListener("dragstart", block, { capture: true });
  document.addEventListener("copy", block, { capture: true });
  document.addEventListener("cut", block, { capture: true });
  document.addEventListener("paste", block, { capture: true });
  document.addEventListener("beforeprint", block, { capture: true });
  document.addEventListener("keydown", function(e){
    var k = (e.key || "").toLowerCase();
    if (e.keyCode === 123 || k === "f12"){ return block(e); }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === "i" || k === "j" || k === "c" || k === "k")){ return block(e); }
    if ((e.ctrlKey || e.metaKey) && (k === "u" || k === "s" || k === "p" || k === "c" || k === "x" || k === "v" || k === "a" || k === "g" || k === "f")){ return block(e); }
    if (k === "printscreen"){ try { navigator.clipboard && navigator.clipboard.writeText(""); } catch(_){} return block(e); }
  }, { capture: true });

  (function(){
    var threshold = 168, killed = false;
    function nuke(){
      if (killed) return; killed = true;
      try { document.documentElement.innerHTML = ""; } catch(_){}
      try { document.documentElement.style.background = "#06254a"; } catch(_){}
      try { window.location.reload(); } catch(_){}
    }
    setInterval(function(){
      if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold){ nuke(); }
      var t0 = new Date().getTime();
      (function(){ var _ = _p; })();
      debugger;
      if (new Date().getTime() - t0 > 260){ nuke(); }
    }, 1400);
  })();
})();
</script>
</body>
</html>
